apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oracle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oracle
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 54321
        runAsGroup: 54321
        fsGroup: 54321
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim
          ports:
            - name: oracle
              containerPort: 1521
          env:
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coldchain-credentials
                  key: ORACLE_SYSTEM_PASSWORD
            - name: APP_USER
              valueFrom:
                secretKeyRef:
                  name: coldchain-credentials
                  key: DB_USERNAME
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coldchain-credentials
                  key: DB_PASSWORD
          startupProbe:
            exec:
              command: ["healthcheck.sh"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /opt/oracle/oradata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
