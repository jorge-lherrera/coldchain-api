spring:
  application:
    name: coldchain-triage
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  datasource:
    url: ${TRIAGE_DB_URL:jdbc:postgresql://localhost:5432/triage}
    username: ${TRIAGE_DB_USERNAME}
    password: ${TRIAGE_DB_PASSWORD}
    hikari:
      pool-name: triage-pool
      maximum-pool-size: ${TRIAGE_DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: coldchain-triage
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      concurrency: ${TRIAGE_CONSUMER_CONCURRENCY:1}
    producer:
      acks: all
      properties:
        enable.idempotence: true

coldchain:
  triage:
    feed-topic: coldchain.telemetry.excursion.v1
    dead-letter-topic: coldchain.triage.excursion-dlt.v1
    api:
      base-url: ${COLDCHAIN_API_URL:http://localhost:8080/api}
      client-id: ${PLATFORM_CLIENT_ID:coldchain-triage}
      client-secret: ${PLATFORM_CLIENT_SECRET:}
    model:
      api-key: ${ANTHROPIC_API_KEY:}
      name: ${TRIAGE_MODEL:claude-opus-5-5}

server:
  port: ${TRIAGE_SERVER_PORT:8081}

logging:
  structured:
    format:
      console: ecs
  include-application-name: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
