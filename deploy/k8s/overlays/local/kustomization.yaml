apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coldchain
resources:
  - ../../base
  - envoy-proxy.yaml
images:
  - name: coldchain-api
    newTag: local
  - name: coldchain-triage
    newTag: local
replicas:
  - name: api
    count: 1
patches:
  - path: gateway-infrastructure.yaml
  - path: resources.yaml
