# ColdChain — shipment: lo que rechaza y por qué.
# Una línea por clave, sin punto final, primera letra en mayúscula.

error.shipment.shipment_not_found=El envío no existe o usted no participa en él
error.shipment.reference_already_in_use=Otro envío ya usa esa referencia
error.shipment.illegal_transition=El envío no puede pasar a ese estado desde donde está
error.shipment.no_lines=Un envío sin líneas no lleva nada
error.shipment.no_device=Un envío sin dispositivo no se puede monitorear
error.shipment.not_the_custodian=Solo la organización que tiene la custodia puede hacer eso
error.shipment.not_the_shipper=Solo el remitente puede cambiar quién participa en un envío
error.shipment.handoff_already_pending=Ese envío ya tiene un traspaso esperando aceptación
error.shipment.handoff_not_found=No hay ningún traspaso esperando en ese envío
error.shipment.handoff_code_invalid=Ese código de traspaso no es el que se emitió
error.shipment.handoff_expired=El código de traspaso venció
error.shipment.handoff_not_yours=El traspaso se abrió para otra organización
error.shipment.participant_already_added=Esa organización ya participa en el envío
error.shipment.participant_not_found=Esa organización no participa en el envío
error.shipment.profile_not_frozen=No se pudo leer el perfil de conservación de una línea, así que no hay nada que congelar
