coldchain:
  security:
    jwt-secret: integration-only-signing-key-that-is-long-enough-to-pass
    issuer: https://integration.coldchain.test
  rate-limit:
    enabled: false
    capacity: 1000
    window: 1m
    trusted-proxies: []

logging:
  level:
    org.testcontainers: warn
    com.zaxxer.hikari: warn
