spring:
  application:
    name: coldchain-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  modulith:
    detection-strategy: explicitly-annotated
    events:
      completion-mode: delete
      republish-outstanding-events-on-restart: true
      staleness:
        published: 1m
        processing: 1m
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: coldchain-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        default_batch_fetch_size: 100
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 100
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
        one-indexed-parameters: false
  jackson:
    default-property-inclusion: always
    datatype:
      datetime:
        write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

coldchain:
  security:
    jwt-secret: ${JWT_SECRET}
    issuer: https://coldchain.dev
    access-token-lifetime: 15m
    refresh-token-lifetime: 7d
    activation-lifetime: 48h
  handoff:
    code-lifetime: 30m
  rate-limit:
    enabled: true
    capacity: 20
    window: 1m
    trusted-proxies: []

  platform:
    client-id: ${PLATFORM_CLIENT_ID:}
    client-secret-hash: ${PLATFORM_CLIENT_SECRET_HASH:}

  advisory:
    alert-topic: coldchain.triage.alert.v1
    dead-letter-topic: coldchain.advisory.alert-dlt.v1
    consumer-group: coldchain-api-advisory

springdoc:
  paths-to-exclude: /internal/**
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    whitelabel:
      enabled: false

logging:
  structured:
    format:
      console: ecs
  include-application-name: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
