spring:
  application:
    name: coldchain-triage
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  datasource:
    url: ${TRIAGE_DB_URL:jdbc:postgresql://localhost:5432/triage}
    username: ${TRIAGE_DB_USERNAME}
    password: ${TRIAGE_DB_PASSWORD}
    hikari:
      pool-name: triage-pool
      maximum-pool-size: ${TRIAGE_DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

server:
  port: ${TRIAGE_SERVER_PORT:8081}

logging:
  structured:
    format:
      console: ecs
  include-application-name: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
