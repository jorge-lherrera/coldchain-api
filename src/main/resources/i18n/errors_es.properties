# ColdChain — los errores que comparte toda la aplicación.
# Una línea por clave, sin punto final, primera letra en mayúscula.

error.core.validation_failed=El cuerpo de la petición no pasó la validación
error.core.malformed_request=No se pudo leer la petición
error.core.unsortable_field=El campo de ordenamiento pedido no se puede ordenar en este endpoint
error.core.not_authenticated=La petición no traía credenciales utilizables
error.core.not_authorized=Las credenciales no autorizan esta operación
error.core.resource_not_found=El recurso no existe o no es visible
error.core.concurrent_modification=El recurso cambió mientras se procesaba esta petición
error.core.too_many_requests=El cliente envió demasiadas peticiones en poco tiempo
error.core.unexpected_failure=No se pudo completar la petición
